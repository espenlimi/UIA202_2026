name: Build and test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    name: Build and test Heimevernet
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ./Heimevernet.slnx

      - name: Build solution
        run: dotnet build ./Heimevernet.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test ./Heimevernet.slnx --configuration Release --no-build --verbosity normal
